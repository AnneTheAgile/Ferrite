# PR CI — compile and test with project MSRV (rust-toolchain.toml)
name: CI

on:
  # Run on PRs, and on pushes to the default branch so a broken build
  # cannot land unnoticed by landing directly instead of via a PR.
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev

      - name: Install Rust (MSRV from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.92.0

      - name: cargo check
        run: cargo check --locked

      - name: cargo test
        run: cargo test --locked

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (MSRV from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.92.0

      - name: cargo check
        run: cargo check --locked

      - name: cargo test
        run: cargo test --locked
